[package]
name = "tachyon-native-client"
version = "0.1.0"
description = "TACHYON cross-platform client"
authors = ["Quantum Box, Inc."]
edition = "2021"

[lib]
name = "tachyon_native_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-secure-storage = "1.5.0"

[target.'cfg(desktop)'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
